# NOTE
#
# If a new setting is added which does not have a sane default for production (e.g. credentials,
# usernames, URLs, IDs, etc.), please add the setting here, and leave the value empty. Then configure
# the `Config` gem (in `config/initializers/config.rb`) to require it (using `config.schema`)
# in order to avoid silent and/or obscure failures of the application caused by `nil` values.
# The required setting should then be set using one of the overriding methods which are documented
# in the section "Settings" of the file `README.md`.

default_locale: :en

log:
  level: info

sidekiq:
  retries: 10

sms_campaigns:
  default_per_page: 25 
  max_body_length: 1600 
  max_segments: 24
  throttle_ip_per_minute: 10
  throttle_user_per_hour: 20
  throttle_intervention_per_hour: 10
  daily_sms_cap: 5000 
  resend_min_interval_minutes: 60
  max_reminder_days_after: 60

participant_uploads:
  max_size_mb: 100
  throttle_per_minute: 20
  download_throttle_per_minute: 30
  max_files_per_question: 1
  scanner: guard_duty
  allowed_content_types:
    - image/jpeg
    - image/png
    - image/gif
    - image/webp
    - image/heic
    - application/pdf
    - application/msword
    - application/vnd.openxmlformats-officedocument.wordprocessingml.document
    - application/vnd.ms-excel
    - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    - text/plain
    - audio/mpeg
    - audio/mp4
    - audio/x-wav
    - video/mp4
    - video/quicktime
  accepted_extensions:
    - jpg
    - jpeg
    - png
    - heic
    - gif
    - webp
    - pdf
    - doc
    - docx
    - xls
    - xlsx
    - csv
    - txt
    - mp3
    - m4a
    - wav
    - mp4
    - m4v
    - mov
  moderation:
    enabled: true
    min_confidence: 80
    content_types:
      - image/jpeg
      - image/png
  inline_preview_content_types:
    - image/jpeg
    - image/png
    - image/gif
    - image/webp
    - application/pdf
