# Ruby on Rails profile for SonarQube Community Edition
# Uses the built-in SonarRuby analyzer (Community Edition)

sonar.projectKey=cias-api
sonar.projectName=cias-api
sonar.sourceEncoding=UTF-8

# db/ is migrate + schema + seeds only, all excluded below; omitted from sources.
sonar.sources=app,lib,config
sonar.tests=spec

sonar.test.inclusions=\
  **/spec/**,\
  **/test/**,\
  **/tests/**,\
  **/features/**,\
  **/*_spec.rb,\
  **/*_test.rb,\
  **/spec_helper.rb,\
  **/rails_helper.rb,\
  **/test_helper.rb,\
  **/support/**,\
  **/factories/**,\
  **/fixtures/**

sonar.exclusions=\
  **/vendor/**,\
  **/node_modules/**,\
  **/tmp/**,\
  **/log/**,\
  **/logs/**,\
  **/public/assets/**,\
  **/public/packs/**,\
  **/public/packs-test/**,\
  **/public/vite/**,\
  **/public/vite-dev/**,\
  **/public/vite-test/**,\
  **/app/assets/builds/**,\
  **/storage/**,\
  **/coverage/**,\
  **/db/schema.rb,\
  **/db/structure.sql,\
  **/db/seeds.rb,\
  **/db/migrate/**,\
  **/bin/**,\
  **/config/environments/**,\
  **/config/puma.rb,\
  **/config/boot.rb,\
  **/config/application.rb,\
  **/config/credentials.yml.enc,\
  **/config/master.key,\
  **/config/database.yml,\
  **/config/cable.yml,\
  **/config/storage.yml,\
  **/config/webpack/**,\
  **/config/webpacker.yml,\
  **/.idea/**,\
  **/.vscode/**,\
  **/.bundle/**,\
  **/Gemfile,\
  **/Gemfile.lock,\
  **/Rakefile,\
  **/*.min.js,\
  **/*.min.css,\
  **/*.bundle.js,\
  **/*.map,\
  **/yarn.lock,\
  **/package-lock.json,\
  **/pnpm-lock.yaml,\
  **/.ruby-version,\
  **/.ruby-gemset,\
  **/.tool-versions,\
  **/.browserslistrc,\
  **/.rubocop.yml,\
  **/.rubocop_todo.yml,\
  **/sorbet/**,\
  **/sorbet.rbi,\
  **/.sorbet/**

sonar.cpd.exclusions=\
  **/spec/**,\
  **/test/**,\
  **/tests/**,\
  **/features/**,\
  **/*_spec.rb,\
  **/*_test.rb,\
  **/db/migrate/**,\
  **/db/schema.rb,\
  **/db/structure.sql,\
  **/config/**,\
  **/factories/**,\
  **/fixtures/**

# Written by SonarJSONFormatter in spec/rails_helper.rb. SonarRuby's SimpleCov
# sensor cannot read coverage/.resultset.json from SimpleCov >= 0.18 (this repo
# is on 0.22), and resolves paths against sonar.projectBaseDir, so the report
# has to be JSON-formatter output with repo-relative paths.
sonar.ruby.coverage.reportPaths=coverage/coverage.json

sonar.coverage.exclusions=\
  **/spec/**,\
  **/test/**,\
  **/tests/**,\
  **/features/**,\
  **/*_spec.rb,\
  **/*_test.rb,\
  **/spec_helper.rb,\
  **/rails_helper.rb,\
  **/test_helper.rb,\
  **/support/**,\
  **/factories/**,\
  **/fixtures/**,\
  **/db/migrate/**,\
  **/db/schema.rb,\
  **/db/structure.sql,\
  **/db/seeds.rb,\
  **/config/**,\
  **/bin/**,\
  **/Rakefile,\
  **/Gemfile,\
  **/app/channels/application_cable/**,\
  **/app/mailers/application_mailer.rb,\
  **/app/jobs/application_job.rb,\
  **/app/models/application_record.rb,\
  **/app/controllers/application_controller.rb

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600

sonar.scm.provider=git
sonar.scm.forceReloadAll=false
