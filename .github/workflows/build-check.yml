name: Build check

# Builds the image for linux/amd64 and checks it, for PRs into dev, test and
# master and for pushes to those branches, and once a week for master. Pushes
# nothing and needs no AWS credentials.

on:
  pull_request:
    branches: [dev, test, master]
  push:
    branches: [dev, test, master]
  workflow_dispatch:
  # A fresh build of master (what production runs) is scanned weekly, so new CVEs
  # show up even when nothing is merged.
  schedule:
    - cron: '17 6 * * 1'

concurrency:
  group: build-check-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scheduled runs start on the default branch (dev); scan master instead.
          ref: ${{ github.event_name == 'schedule' && 'master' || '' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          provenance: false
          # A cached apt-get upgrade layer would hide newer Debian fixes from the weekly scan.
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SOURCE_VERSION=build-check-${{ github.sha }}
            BUNDLER_VERSION=2.4.22
          tags: cias-api:build-check

      - name: Inspect image
        run: |
          {
            echo "## Image build successful"
            echo ""
            echo '```'
            docker image inspect cias-api:build-check \
              --format 'Size: {{.Size}} bytes / Arch: {{.Architecture}}/{{.Os}} / Created: {{.Created}}'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify native gems installed correctly
        # A missing builder package would already have failed `bundle install`; this just
        # logs which pg variant (native or source-compiled) ended up in the image.
        run: |
          docker run --rm cias-api:build-check bundle info pg
          docker run --rm cias-api:build-check bundle info argon2-kdf
          docker run --rm cias-api:build-check bundle info zlib

      - name: Smoke test — Rails + pg load
        # Boots Ruby just far enough to require pg and confirm the native extension loads.
        # If libpq-dev was needed and missing, this fails with "cannot load such file -- pg_ext".
        run: |
          docker run --rm \
            -e SECRET_KEY_BASE=$(openssl rand -hex 64) \
            cias-api:build-check \
            bundle exec ruby -e '
              require "pg"
              puts "pg loaded OK, libpq version: #{PG.library_version}"
              require "argon2"
              puts "argon2 loaded OK"
            '

      - name: Verify the Sectigo R46 root is trusted
        # Epic on FHIR and HFHS chain to it; bookworm's ca-certificates lacks it (see Dockerfile).
        run: |
          docker run --rm cias-api:build-check ruby -ropenssl -e '
            root = OpenSSL::X509::Certificate.new(
              File.read("/usr/local/share/ca-certificates/sectigo-public-server-authentication-root-r46.crt"))
            store = OpenSSL::X509::Store.new
            store.set_default_paths
            abort "Sectigo R46 is not in the default trust store" unless store.verify(root)
            puts "Sectigo R46 is trusted"
          '

      - name: Verify /release-version is baked in
        run: |
          VERSION=$(docker run --rm cias-api:build-check cat /release-version)
          echo "Release version in image: $VERSION"
          [ "$VERSION" = "build-check-${{ github.sha }}" ] || (echo "Mismatch"; exit 1)

      # The code and gems are owned by root; the app user may write only tmp/ and
      # log/ (see the Dockerfile).
      - name: Check the app user can't change the code
        run: |
          docker run --rm cias-api:build-check sh -c '
            touch tmp/.write-check log/.write-check || { echo "tmp/ or log/ is not writable"; exit 1; }
            for path in app/.write-check config/.write-check Gemfile.lock /usr/local/bundle/gems/.write-check; do
              if touch "$path" 2>/dev/null; then echo "$path is writable by $(id -un)"; exit 1; fi
            done
            echo "Only tmp/ and log/ are writable by $(id -un)"
          '

      # Lists vulnerabilities that have a fix (Debian packages, gems/npm packages, and
      # Ruby's/Node's own) in the job summary. On PRs and pushes a finding marks this step
      # failed without failing the job; the weekly run fails, so it sends a notification.
      # Runs the scanner's image pinned by digest rather than aquasecurity/trivy-action,
      # whose tags were hijacked in March 2026 (CVE-2026-33634). Dependabot doesn't update
      # docker images in workflows, so bump this pin by hand now and then.
      - name: Scan the image for fixable vulnerabilities
        continue-on-error: ${{ github.event_name != 'schedule' }}
        env:
          TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
        run: |
          status=0
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --quiet --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL \
            --exit-code 1 cias-api:build-check > trivy.txt || status=$?
          {
            echo "## Fixable HIGH/CRITICAL vulnerabilities"
            echo '```'
            cat trivy.txt
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"
