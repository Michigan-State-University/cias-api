name: CI
on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup_environment:
    name: Prepare environment & split tests
    runs-on: ubuntu-22.04
    outputs:
      test-groups: ${{ steps.set-test-groups.outputs.test-groups }}
      group-by: ${{ steps.set-group-by.outputs.group-by }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.8
        env:
          RUBYOPT: --jit

      - uses: actions/cache@v5
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-
      - name: Install dependencies
        run: |
          sudo apt install libffi7
          gem install bundler -v 2.4.22
          bundle config set path 'vendor/bundle'
          bundle install

      - name: Analyze with Rubocop
        run: bundle exec rubocop

      - name: Restore test runtime log
        uses: actions/cache/restore@v5
        with:
          path: tmp/parallel_runtime_rspec.log
          key: rspec-runtime-${{ github.run_id }}
          restore-keys: |
            rspec-runtime-

      - id: set-group-by
        name: Set grouping strategy
        run: |
          if [ -s tmp/parallel_runtime_rspec.log ]; then
            echo "group-by=runtime" >> $GITHUB_OUTPUT
          else
            echo "group-by=filesize" >> $GITHUB_OUTPUT
          fi

      # all test jobs must split by the same log, otherwise files could be skipped or run twice
      - name: Share test runtime log
        if: steps.set-group-by.outputs.group-by == 'runtime'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rspec-runtime-baseline
          path: tmp/parallel_runtime_rspec.log
          retention-days: 1

      - id: set-test-groups
        name: Set test groups
        #0-based ids, so the output never contains the secret value (GitHub drops such outputs)
        run: echo "test-groups=$(jq -cn --argjson count ${{ secrets.TEST_BATCH_COUNT }} '[range(0; $count)]')" >> $GITHUB_OUTPUT

  bundler_audit:
    name: Dependency security audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.8
      - name: Audit dependencies
        continue-on-error: true #untill fix all issues
        run: |
          gem install bundler-audit
          bundle-audit check --update

  test:
    name: Test batch no. ${{ matrix.group }}
    needs: setup_environment
    runs-on: ubuntu-22.04
    env:
      #rspec processes per job, each with its own database
      TEST_PROCESSES: 4
    strategy:
      matrix:
        group: ${{ fromJson(needs.setup_environment.outputs.test-groups) }}
    services:
      database:
        image: postgres:13.0-alpine
        env:
          POSTGRES_PASSWORD: 7AU0lHRd5OglmKO
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      cache:
        image: redis
        options: --entrypoint redis-server
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1 #the other ruby action was deprecated so we use a new one now
        with:
          ruby-version: 3.3.8
        env:
          RUBYOPT: --jit
      - run: cp .env.template .env
      - run: cp ./config/database.docker.yml ./config/database.yml
      - uses: actions/cache@v5
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-
      - name: Build
        env:
          BUNDLER_VERSION: 2.4.22
          GIT_AUTHOR_EMAIL: ci@ci.ci
          RAILS_ENV: test
          REDIS_URL: redis://localhost:6379/
        run: |
          sudo apt install libffi7
          gem install bundler -v "2.4.22"
          bundle config set path 'vendor/bundle'
          bundle install
          ruby -rsecurerandom -e 'File.write("tmp/local_secret.txt", SecureRandom.hex(64))' #generated up front, parallel Rails boots race on creating it
          bundle exec rake "parallel:create[$TEST_PROCESSES]" "parallel:load_schema[$TEST_PROCESSES]"
      - name: Download test runtime log
        if: needs.setup_environment.outputs.group-by == 'runtime'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rspec-runtime-baseline
          path: tmp
      - name: Run test batch
        run: >-
          bundle exec parallel_rspec spec
          -n $(( ${{ strategy.job-total }} * TEST_PROCESSES ))
          --only-group $(seq -s, $(( ${{ strategy.job-index }} * TEST_PROCESSES + 1 )) $(( (${{ strategy.job-index }} + 1) * TEST_PROCESSES )))
          --group-by ${{ needs.setup_environment.outputs.group-by }}
          --runtime-log tmp/parallel_runtime_rspec.log
          --verbose-command
          -o '--profile 20 --format progress --format ParallelTests::RSpec::RuntimeLogger --out tmp/runtime_logs/group_${{ matrix.group }}.log'
      - name: Upload test runtimes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rspec-runtime-group-${{ matrix.group }}
          path: tmp/runtime_logs/
          retention-days: 1

      # SimpleCov writes this on every rspec run (see spec/rails_helper.rb).
      # The collate job below merges the shards for the Code Quality workflow.
      #
      # All TEST_PROCESSES rspec processes of this job share one
      # coverage/.resultset.json: SimpleCov names each run after its
      # TEST_ENV_NUMBER ("(1/1)", "(2/1)", ...) and stores it under a file lock,
      # so the file ends up holding every process of the batch.
      #
      # always(): a batch that failed still covered the files it reached, and a
      # partial figure beats none. A missing resultset means the batch died
      # before SimpleCov could write, which must not fail the job -- but `warn`
      # rather than `ignore`, so it is visible. `ignore` is what let the
      # hidden-file exclusion below go unnoticed for a whole green run.
      - name: Upload coverage shard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-shard-${{ matrix.group }}
          path: coverage/.resultset.json
          retention-days: 1
          if-no-files-found: warn
          # SimpleCov's resultset is a dotfile, and upload-artifact excludes
          # hidden files by default -- without this the upload silently finds
          # nothing and coverage never reaches the scan.
          include-hidden-files: true

  save_runtime_log:
    name: Save test runtime log
    needs: test
    runs-on: ubuntu-22.04

    steps:
      - name: Download test runtimes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: rspec-runtime-group-*
          path: tmp/runtime_logs
          merge-multiple: true
      - name: Merge test runtimes
        run: cat tmp/runtime_logs/*.log | grep -E '^spec/.+_spec\.rb:[0-9.]+$' > tmp/parallel_runtime_rspec.log
      - name: Save test runtime log
        uses: actions/cache/save@v5
        with:
          path: tmp/parallel_runtime_rspec.log
          key: rspec-runtime-${{ github.run_id }}

  collate_coverage:
    name: Collate coverage
    needs: test
    # Run when batches FAILED -- their partial coverage still counts, and
    # without this one red batch would mean no coverage at all. Skip when they
    # were never reached (a red Rubocop skips the matrix) or cancelled, where
    # there is provably nothing to merge.
    if: ${{ !cancelled() && needs.test.result != 'skipped' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: 3.3.8

      - name: Download coverage shards
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: coverage-shards
          pattern: coverage-shard-*

      # Standalone gems rather than `bundle install`: collation needs SimpleCov
      # only, and installing 260 gems to merge some JSON would cost more than
      # the job itself.
      #
      # Versions are read from Gemfile.lock, not pinned here. SimpleCov's
      # resultset format is version-sensitive -- the 0.18 change is the whole
      # reason spec/sonar_json_formatter.rb exists -- so a bump that left this
      # behind would have the shards written by one version and merged by
      # another. SimpleCov.collate would drop everything and the scan would
      # silently lose coverage with nothing going red.
      - name: Collate shard coverage
        run: |
          lockver() { grep -m1 -E "^    $1 \(" Gemfile.lock | sed -E 's/.*\(([^)]+)\).*/\1/'; }
          gem install --no-document \
            "simplecov:$(lockver simplecov)" \
            "simplecov_json_formatter:$(lockver simplecov_json_formatter)"
          ruby script/collate_coverage.rb

      - name: Upload collated coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage/coverage.json
          retention-days: 1
          # Not a dotfile, so no include-hidden-files needed here. warn, not
          # ignore: no report is a legitimate outcome, but it should be visible
          # in the run rather than only in the script's own output.
          if-no-files-found: warn
