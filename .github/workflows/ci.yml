name: CI
on: push

jobs:
  setup_environment:
    name: Prepare environment & split tests
    runs-on: ubuntu-22.04
    outputs:
      test-groups: ${{ steps.set-test-groups.outputs.test-groups }}
      group-by: ${{ steps.set-group-by.outputs.group-by }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.8
        env:
          RUBYOPT: --jit

      - uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-
      - name: Install dependencies
        run: |
          sudo apt install libffi7
          gem install bundler -v 2.4.22
          bundle config set path 'vendor/bundle'
          bundle install

      - name: Analyze with Rubocop
        run: bundle exec rubocop

      - name: Restore test runtime log
        uses: actions/cache/restore@v4
        with:
          path: tmp/parallel_runtime_rspec.log
          key: rspec-runtime-${{ github.run_id }}
          restore-keys: |
            rspec-runtime-

      - id: set-group-by
        name: Set grouping strategy
        run: |
          if [ -s tmp/parallel_runtime_rspec.log ]; then
            echo "group-by=runtime" >> $GITHUB_OUTPUT
          else
            echo "group-by=filesize" >> $GITHUB_OUTPUT
          fi

      # all test jobs must split by the same log, otherwise files could be skipped or run twice
      - name: Share test runtime log
        if: steps.set-group-by.outputs.group-by == 'runtime'
        uses: actions/upload-artifact@v4
        with:
          name: rspec-runtime-baseline
          path: tmp/parallel_runtime_rspec.log
          retention-days: 1

      - id: set-test-groups
        name: Set test groups
        #0-based ids, so the output never contains the secret value (GitHub drops such outputs)
        run: echo "test-groups=$(jq -cn --argjson count ${{ secrets.TEST_BATCH_COUNT }} '[range(0; $count)]')" >> $GITHUB_OUTPUT

  test:
    name: Test batch no. ${{ matrix.group }}
    needs: setup_environment
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        group: ${{ fromJson(needs.setup_environment.outputs.test-groups) }}
    services:
      database:
        image: postgres:13.0-alpine
        env:
          POSTGRES_PASSWORD: 7AU0lHRd5OglmKO
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      cache:
        image: redis
        options: --entrypoint redis-server
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1 #the other ruby action was deprecated so we use a new one now
        with:
          ruby-version: 3.3.8
        env:
          RUBYOPT: --jit
      - run: cp .env.template .env
      - run: cp ./config/database.docker.yml ./config/database.yml
      - uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-
      - name: Build
        env:
          BUNDLER_VERSION: 2.4.22
          DATABASE_URL: postgres://postgres:7AU0lHRd5OglmKO@localhost:5432/cias_test
          GIT_AUTHOR_EMAIL: ci@ci.ci
          RAILS_ENV: test
          REDIS_URL: redis://localhost:6379/
        run: |
          sudo apt install libffi7
          gem install bundler -v "2.4.22"
          bundle config set path 'vendor/bundle'
          bundle install
          bundle exec rails db:create db:schema:load --trace
      - name: Download test runtime log
        if: needs.setup_environment.outputs.group-by == 'runtime'
        uses: actions/download-artifact@v4
        with:
          name: rspec-runtime-baseline
          path: tmp
      - name: Run test batch
        run: >-
          bundle exec parallel_rspec spec
          -n ${{ strategy.job-total }}
          --only-group $(( ${{ strategy.job-index }} + 1 ))
          --group-by ${{ needs.setup_environment.outputs.group-by }}
          --runtime-log tmp/parallel_runtime_rspec.log
          --verbose-command
          -o '--format progress --format ParallelTests::RSpec::RuntimeLogger --out tmp/runtime_logs/group_${{ matrix.group }}.log'
      - name: Upload test runtimes
        uses: actions/upload-artifact@v4
        with:
          name: rspec-runtime-group-${{ matrix.group }}
          path: tmp/runtime_logs/
          retention-days: 1
      - name: Analyze with bundler audit
        continue-on-error: true #untill fix all issues
        run: |
          gem install bundler-audit
          bundle-audit check --update

  save_runtime_log:
    name: Save test runtime log
    needs: test
    runs-on: ubuntu-22.04

    steps:
      - name: Download test runtimes
        uses: actions/download-artifact@v4
        with:
          pattern: rspec-runtime-group-*
          path: tmp/runtime_logs
          merge-multiple: true
      - name: Merge test runtimes
        run: cat tmp/runtime_logs/*.log | grep -E '^spec/.+_spec\.rb:[0-9.]+$' > tmp/parallel_runtime_rspec.log
      - name: Save test runtime log
        uses: actions/cache/save@v4
        with:
          path: tmp/parallel_runtime_rspec.log
          key: rspec-runtime-${{ github.run_id }}
