name: Deploy API

# Builds the cias-api image, runs database migrations as a one-off ECS task and,
# only if they succeed, rolls the api and worker services onto the new image.
# The steps live in .github/workflows/deploy-api.sh.
#
# Triggers:
#   - Publishing a GitHub release: a pre-release (e.g. v1.4.0-rc.1, cut from
#     test) deploys to staging; a full release (e.g. v1.4.0, cut from master)
#     deploys to production. The release tag becomes the image tag.
#   - Actions → Deploy API → Run workflow: redeploys or rollbacks, on any branch
#     or tag, to the environment you pick. Only available once this file is on
#     the default branch (dev).
#
# A release runs the workflow from the tagged commit, so it only deploys from
# commits that contain this file and the Dockerfile.
#
# Each GitHub environment holds that site's AWS settings as variables (see the
# deploy job's env block). Give production environments required reviewers so a
# deploy waits for approval, and restrict them to release tags.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        type: environment
        required: true

permissions:
  contents: read

jobs:
  # Works out where this run deploys, and refuses to send anything but a master
  # commit beyond staging, before anyone is asked to approve the deploy.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      image_tag: ${{ steps.target.outputs.image_tag }}
    steps:
      - name: Pick the environment and image tag
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == release ]]; then
            [[ "$PRERELEASE" == true ]] && environment=staging || environment=production
          else
            environment="$INPUT_ENVIRONMENT"
          fi

          # Tag runs deploy as the tag name; branch runs fall back to the commit SHA
          # (.github/workflows/deploy-api.sh's default).
          image_tag=""
          if [[ "$REF_TYPE" == tag ]]; then
            image_tag="$REF_NAME"
            if [[ ! "$image_tag" =~ ^[A-Za-z0-9_.-]{1,128}$ ]]; then
              echo "::error::Tag '$image_tag' isn't a valid image tag (letters, digits, '.', '_', '-')"
              exit 1
            fi
          fi

          echo "Deploying ${image_tag:-$GITHUB_SHA} to $environment"
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps.target.outputs.environment != 'staging'
        with:
          fetch-depth: 0

      - name: Check the commit is on master
        if: steps.target.outputs.environment != 'staging'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Only commits on master can be deployed outside staging; cut the release from master"
            exit 1
          fi

  deploy:
    needs: resolve
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.environment }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write # GitHub OIDC token, exchanged for the environment's AWS role
    concurrency:
      group: deploy-api-${{ needs.resolve.outputs.environment }}
      # Never cancel a running deploy: it may be partway through migrations.
      cancel-in-progress: false
    env:
      DEPLOY_ENV: ${{ needs.resolve.outputs.environment }}
      IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
      ECS_CLUSTER_ARN: ${{ vars.ECS_CLUSTER_ARN }}
      API_SERVICE_ARN: ${{ vars.API_SERVICE_ARN }}
      WORKER_SERVICE_ARN: ${{ vars.WORKER_SERVICE_ARN }}
      MIGRATE_TASK_DEFINITION_ARN: ${{ vars.MIGRATE_TASK_DEFINITION_ARN }}
      MIGRATE_SUBNET_IDS: ${{ vars.MIGRATE_SUBNET_IDS }}
      MIGRATE_SECURITY_GROUP_IDS: ${{ vars.MIGRATE_SECURITY_GROUP_IDS }}
      MIGRATE_ASSIGN_PUBLIC_IP: ${{ vars.MIGRATE_ASSIGN_PUBLIC_IP }}
      # Optional: when set, the database is snapshotted before migrations run.
      # Set it on production environments; some migrations are irreversible.
      RDS_DB_INSTANCE_ID: ${{ vars.RDS_DB_INSTANCE_ID }}
    steps:
      # .github/workflows/deploy-api.sh falls back to cias-test values for unset settings, so
      # an environment with a missing variable would deploy to test. Fail instead.
      - name: Check environment variables
        run: |
          missing=()
          for var in AWS_ACCOUNT_ID AWS_DEPLOY_ROLE_ARN AWS_REGION ECR_REPOSITORY_URI \
            ECS_CLUSTER_ARN API_SERVICE_ARN WORKER_SERVICE_ARN MIGRATE_TASK_DEFINITION_ARN \
            MIGRATE_SUBNET_IDS MIGRATE_SECURITY_GROUP_IDS MIGRATE_ASSIGN_PUBLIC_IP; do
            [[ -n "${!var}" ]] || missing+=("$var")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Set these variables on the '$DEPLOY_ENV' environment: ${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          # Refuse to deploy if the role belongs to a different account.
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: deploy-api-${{ github.run_id }}

      - name: Snapshot the database
        if: env.RDS_DB_INSTANCE_ID != ''
        run: |
          snapshot_id="cias-api-predeploy-${GITHUB_SHA::8}-${GITHUB_RUN_ID}"
          echo "Creating $snapshot_id"
          aws rds create-db-snapshot \
            --db-instance-identifier "$RDS_DB_INSTANCE_ID" \
            --db-snapshot-identifier "$snapshot_id" >/dev/null
          aws rds wait db-snapshot-available --db-snapshot-identifier "$snapshot_id"
          echo "Snapshot $snapshot_id is available"

      - name: Build, migrate and deploy
        run: .github/workflows/deploy-api.sh . "$IMAGE_TAG"
